spring.data.mongodb.auto-index-creation=false


#Configuración refreshCookie 
app.cookie.http-only=${APP_COOKIE_HTTP_ONLY:true}
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:lax}

# Url del SecurityConfig
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.frontend.url=${APP_FRONTEND_URL}
app.test-upload.enabled=false


#Control de mensaejes
logging.level.root=WARN
logging.level.com.manitascrochet=INFO

# Habilitar el registro de ususario
app.security.signup=false
