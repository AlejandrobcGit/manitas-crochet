spring.application.name=backend
# Url de conexión de MondoDb Altas
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
# exposición de la APIs
app.protocolo=${APP_PROTOCOLO:https}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
# exposición de la frontend
app.frontend.url=${APP_FRONTEND_URL}
#configuracion subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# configuración token jwt
jwt.secret=${JWT_SECRET}
jwt.expirationMs=900000
jwt.refreshExpirationMs=604800000
# Habilitar el registro de ususario
app.security.signup=true
# configuración de correo electrónico Gmail.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_ADDRESS}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Configuración refreshCookie 
app.cookie.http-only:true
app.cookie.secure:false
app.cookie.same-site:Lax

# Url del SecurityConfig
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ImageKit
imagekit.public.key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private.key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url.endpoint=${IMAGEKIT_URL_ENDPOINT}
imagekit.folder=${IMAGEKIT_FOLDER:imagenes}

# Habilita el CommandLineRunner de prueba que sube imágenes de ejemplo a ImageKit al arrancar (solo para desarrollo/pruebas)
app.test-upload.enabled=false

#Control de mensaejes
logging.level.root=INFO

#Actuator prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

#configuracion subida de archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# HSTS -> HTTP interno + cabeceras X-Forwarded-*
#necesario por la estrutura
#    Navegador
#    │ HTTPS
#    ▼
#    Google Frontend / Load Balancer
#    │ HTTP interno + cabeceras X-Forwarded-*
#    ▼
#    Tu contenedor Spring Boot
server.forward-headers-strategy=framework

